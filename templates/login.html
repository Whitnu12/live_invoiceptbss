<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login | PT Banggai Sentral Sulawesi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, .10);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            color: #0f172a;
            font-size: 23px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #64748b;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border:
                1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #10b981;
            box-shadow:
                0 0 0 3px
                rgba(16,185,129,.12);
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 13px;
            background: #10b981;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #059669;
        }

        .alert {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">
            <h1>
                PT. BANGGAI SENTRAL SULAWESI
            </h1>

            <p>
                Sistem Pengelolaan Proforma Invoice
                & Keuangan
            </p>
        </div>

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
        >

            <div class="form-group">

                <label>
                    Username / Email
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username atau email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                Masuk Sistem
            </button>

        </form>

        <div class="footer">
            PT Banggai Sentral Sulawesi
        </div>

    </div>

</div>

</body>
</html>
